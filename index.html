<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241E5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SvF Future">
<title>SvF Future</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="run.css">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #241E5C; --ink2: #3B3196; --ink3: #5247B8;
  --or: #F28C28; --or2: #FFB25E; --peach: #F6B07A;
  --cream: #FFF6EC; --card: #ffffff; --muted: #6E6A8F; --line: #EEE6DC;
  --ok: #1F9D5B; --bad: #E2453C;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --disp: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 22px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
body { overscroll-behavior-y: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
a { color: inherit; }
[hidden] { display: none !important; }
img { display: block; max-width: 100%; }
h1, h2, h3 { font-family: var(--disp); margin: 0; letter-spacing: -.01em; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--safe-b) + 96px); position: relative; }
.view { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.pad { padding: 0 18px; }
.sec { margin: 30px 0 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 18px; margin-bottom: 12px; }
.sec-h h2 { font-size: 22px; font-weight: 800; }
.sec-h button { color: var(--or); font-weight: 700; font-size: 14px; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--or); }
.muted { color: var(--muted); }

/* ---------- Hero ---------- */
.hero { position: relative; min-height: 470px; color: #fff; overflow: hidden; border-radius: 0 0 34px 34px; background: var(--ink); }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transform: scale(1.05); animation: kenburns 18s ease-in-out infinite alternate; }
@keyframes kenburns { to { transform: scale(1.14) translateY(-10px); } }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(36,30,92,.55) 0%, rgba(36,30,92,.15) 35%, rgba(36,30,92,.85) 78%, #241E5C 100%); }
.hero .in { position: relative; z-index: 2; padding: calc(var(--safe-t) + 18px) 20px 96px; min-height: 470px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 40px; height: 40px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.brand b { font-family: var(--disp); font-size: 15px; display: block; }
.brand span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.brand .bell { margin-left: auto; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; font-size: 19px; position: relative; }
.brand .bell i { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--or); box-shadow: 0 0 0 2px var(--ink); }
.hero h1 { margin-top: auto; font-size: clamp(38px, 11vw, 54px); line-height: .98; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--or2); }
.hero p { margin: 12px 0 0; font-size: 16px; opacity: .9; max-width: 330px; line-height: 1.45; }

/* ---------- Countdown ---------- */
.count { position: relative; margin: -74px 14px 0; z-index: 5; border-radius: 28px; padding: 20px 18px 18px; color: #fff; background: radial-gradient(120% 140% at 0% 0%, #FFB25E 0%, #F28C28 45%, #E0661A 100%); box-shadow: 0 18px 40px -12px rgba(242,140,40,.55); overflow: hidden; }
.count::before { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 22px solid rgba(255,255,255,.14); }
.count .kicker { color: rgba(255,255,255,.85); }
.count h3 { font-size: 20px; margin: 4px 0 14px; font-weight: 800; }
.digits { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 8px; }
.digit { background: rgba(255,255,255,.18); border-radius: 16px; padding: 10px 6px 8px; text-align: center; backdrop-filter: blur(6px); }
.digit b { font-family: var(--disp); font-size: 30px; font-weight: 800; display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.digit:first-child b { font-size: 38px; }
.digit span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.count .row { display: flex; gap: 8px; margin-top: 14px; }
.btn { height: 48px; border-radius: 16px; padding: 0 18px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: transform .15s; }
.btn:active { transform: scale(.97); }
.btn.w { background: #fff; color: var(--ink); }
.btn.g { background: rgba(255,255,255,.2); color: #fff; }
.btn.ink { background: var(--ink); color: #fff; }
.btn.or { background: var(--or); color: #fff; }
.btn.soft { background: #F1ECFF; color: var(--ink2); }
.btn.line { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.full { width: 100%; }
.btn.flex { flex: 1; }

/* ---------- Cards ---------- */
.card { background: var(--card); border-radius: var(--r); box-shadow: 0 1px 0 rgba(36,30,92,.04), 0 10px 30px -18px rgba(36,30,92,.35); }
.notif { margin: 18px 14px 0; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.notif .ic { width: 44px; height: 44px; border-radius: 14px; background: #F1ECFF; display: grid; place-items: center; font-size: 22px; flex: none; }
.notif b { display: block; font-size: 15px; }
.notif span { font-size: 13px; color: var(--muted); }
.notif .btn { margin-left: auto; height: 40px; padding: 0 14px; font-size: 14px; }

.hscroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 18px 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.ev { text-align: left; flex: none; width: 76%; max-width: 330px; scroll-snap-align: start; overflow: hidden; position: relative; }
.ev .im { height: 150px; background: linear-gradient(135deg, var(--ink2), var(--ink)) center/cover; position: relative; display: grid; place-items: center; font-size: 54px; }
.ev .im::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(36,30,92,.45)); }
.card .date { position: absolute; left: 12px; top: 12px; z-index: 2; background: #fff; border-radius: 14px; padding: 6px 10px; text-align: center; min-width: 52px; box-shadow: 0 6px 14px rgba(0,0,0,.18); }
.card .date b { font-family: var(--disp); font-size: 22px; line-height: 1; display: block; color: var(--ink); }
.card .date span { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--or); }
.ev .tx { padding: 12px 14px 14px; }
.ev .tx b, .evbig .tx b { font-family: var(--disp); font-size: 18px; display: block; line-height: 1.15; }
.ev .tx span, .evbig .tx span { font-size: 13px; color: var(--muted); display: block; margin-top: 4px; }
.ig-tag { position: absolute; right: 10px; top: 12px; z-index: 2; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 10px; backdrop-filter: blur(6px); }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 14px; }
.fact { background: var(--ink); color: #fff; border-radius: 20px; padding: 14px 12px; position: relative; overflow: hidden; }
.fact::after { content: ""; position: absolute; right: -18px; bottom: -18px; width: 60px; height: 60px; border-radius: 50%; background: rgba(242,140,40,.25); }
.fact b { font-family: var(--disp); font-size: 32px; font-weight: 800; display: block; line-height: 1; color: var(--or2); }
.fact span { font-size: 12px; opacity: .85; display: block; margin-top: 6px; line-height: 1.3; }

.play { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px; }
.tile { border-radius: 24px; padding: 16px; min-height: 150px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; text-align: left; position: relative; overflow: hidden; }
.tile .e { font-size: 34px; }
.tile b { font-family: var(--disp); font-size: 19px; line-height: 1.1; }
.tile span { font-size: 12px; opacity: .85; }
.tile.a { background: linear-gradient(150deg, #5247B8, #241E5C); }
.tile.b { background: linear-gradient(150deg, #FFB25E, #E0661A); }
.tile::after { content: "→"; position: absolute; right: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-size: 15px; }

.ig { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 0 14px 10px; }
.ig .av { width: 50px; height: 50px; border-radius: 50%; padding: 3px; background: conic-gradient(from 200deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5, #FEDA75); flex: none; }
.ig .av div { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 22px; border: 2px solid #fff; }
.ig b { font-size: 15px; display: block; }
.ig span { font-size: 13px; color: var(--muted); }
.ig .acts { margin-left: auto; display: flex; gap: 6px; }
.ig .acts a { height: 36px; padding: 0 12px; border-radius: 12px; font-size: 13px; font-weight: 700; display: grid; place-items: center; text-decoration: none; }
.ig .acts .f { background: var(--ink); color: #fff; }
.ig .acts .m { background: #F1ECFF; color: var(--ink2); }

.gal { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px; }
.gal button { aspect-ratio: 1; border-radius: 18px; background: #ddd center/cover; overflow: hidden; }
.gal button:first-child { grid-column: span 2; aspect-ratio: 16/10; }

/* ---------- Page header ---------- */
.ph { padding: calc(var(--safe-t) + 22px) 18px 6px; }
.ph h1 { font-size: 36px; font-weight: 800; line-height: 1; margin-top: 6px; }
.ph p { margin: 8px 0 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.seg { display: flex; background: #EFE7DD; border-radius: 16px; padding: 4px; margin: 16px 18px 0; }
.seg button { flex: 1; height: 42px; border-radius: 12px; font-weight: 700; font-size: 15px; color: var(--muted); transition: all .2s; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(36,30,92,.12); }

.evbig { margin: 14px 14px 0; overflow: hidden; position: relative; display: block; width: calc(100% - 28px); text-align: left; }
.evbig .tx b { font-size: 22px; }
.evbig .im { height: 190px; background: linear-gradient(135deg, #5247B8, #241E5C) center/cover; position: relative; display: grid; place-items: center; font-size: 64px; }
.evbig .tx { padding: 14px 16px 16px; }
.evbig h3 { font-size: 22px; line-height: 1.1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: #F4EEE7; color: var(--ink); }
.chip.o { background: #FFF0E0; color: #C2620F; }
.chip.v { background: #F1ECFF; color: var(--ink2); }
.empty { text-align: center; color: var(--muted); padding: 40px 24px; line-height: 1.5; }
.empty .e { font-size: 44px; display: block; margin-bottom: 8px; }

.tl { margin: 18px 18px 0; position: relative; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: linear-gradient(var(--or), var(--ink3)); }
.tli { position: relative; margin-bottom: 14px; padding: 14px 16px; }
.tli::before { content: ""; position: absolute; left: -24px; top: 20px; width: 15px; height: 15px; border-radius: 50%; background: #fff; border: 4px solid var(--or); }
.tli.past { opacity: .5; }
.tli.past::before { border-color: #bbb; }
.tli .when { font-size: 12px; font-weight: 800; color: var(--or); letter-spacing: .05em; text-transform: uppercase; }
.tli b { font-family: var(--disp); font-size: 19px; display: block; margin: 3px 0; }
.tli p { margin: 4px 0 0; font-size: 14px; color: var(--muted); line-height: 1.45; }
.tli .in { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 800; color: #fff; background: var(--ink); padding: 5px 10px; border-radius: 10px; }

/* ---------- Programs ---------- */
.quizcta { margin: 16px 14px 0; border-radius: 28px; overflow: hidden; position: relative; color: #fff; min-height: 210px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; text-align: left; width: calc(100% - 28px); background: #241E5C url(img/p-civil.jpg) center/cover; }
.quizcta::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(36,30,92,.2), rgba(36,30,92,.92)); }
.quizcta > * { position: relative; }
.quizcta h2 { font-size: 28px; line-height: 1.05; margin: 6px 0 8px; }
.quizcta .btn { align-self: flex-start; margin-top: 8px; }
.progs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px; }
.prog { border-radius: 22px; overflow: hidden; position: relative; aspect-ratio: 3/4; background: #241E5C center/cover; color: #fff; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; }
.prog::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(36,30,92,0) 30%, rgba(36,30,92,.92)); }
.prog > * { position: relative; }
.prog .e { position: absolute; top: 10px; left: 10px; width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.9); display: grid; place-items: center; font-size: 20px; }
.prog b { font-family: var(--disp); font-size: 16px; line-height: 1.1; }
.prog span { font-size: 11px; opacity: .85; margin-top: 4px; line-height: 1.3; }
.life { display: flex; gap: 12px; overflow-x: auto; padding: 4px 10% 10px; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-padding: 0 10%; }
.life::-webkit-scrollbar { display: none; }
.lc { flex: none; width: 80%; max-width: 340px; scroll-snap-align: center; overflow: hidden; }
.lc .im { height: 160px; background: #ddd center/cover; }
.lc .tx { padding: 14px 16px 16px; }
.lc b { font-family: var(--disp); font-size: 19px; display: block; }
.lc p { margin: 6px 0 0; font-size: 14px; color: var(--muted); line-height: 1.45; }

/* ---------- Apply ---------- */
.big3 { margin: 16px 14px 0; padding: 6px 16px; background: var(--ink); color: #fff; border-radius: 26px; }
.big3 div { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.1); font-family: var(--disp); font-size: 19px; font-weight: 800; }
.big3 div:last-child { border: 0; }
.big3 i { width: 34px; height: 34px; border-radius: 10px; background: var(--or); display: grid; place-items: center; font-style: normal; font-size: 18px; flex: none; }
.big3 em { font-style: normal; color: var(--or2); }
.ring { display: flex; align-items: center; gap: 14px; margin: 18px 18px 6px; }
.ring svg { flex: none; }
.ring b { font-family: var(--disp); font-size: 20px; display: block; }
.ring span { color: var(--muted); font-size: 14px; }
.step { display: flex; gap: 14px; align-items: flex-start; margin: 10px 14px 0; padding: 14px 16px; }
.step .ck { width: 30px; height: 30px; border-radius: 10px; border: 2.5px solid #D9CFF5; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; transition: all .2s; }
.step.done .ck { background: var(--ok); border-color: var(--ok); }
.step.done b { text-decoration: line-through; opacity: .55; }
.step b { font-size: 16px; display: block; }
.step p { margin: 4px 0 0; font-size: 14px; color: var(--muted); line-height: 1.45; }
.step .go { margin-top: 10px; display: inline-flex; font-size: 13px; font-weight: 800; color: var(--or); }
.dorms { display: flex; gap: 12px; overflow-x: auto; padding: 4px 18px 10px; scrollbar-width: none; }
.dorms::-webkit-scrollbar { display: none; }
.dorm { flex: none; width: 210px; padding: 16px; position: relative; overflow: hidden; }
.dorm .e { font-size: 30px; }
.dorm b { font-family: var(--disp); font-size: 18px; display: block; margin-top: 8px; }
.dorm .p { font-family: var(--disp); font-size: 26px; font-weight: 800; color: var(--or); margin-top: 6px; }
.dorm .p small { font-size: 13px; color: var(--muted); font-family: var(--body); font-weight: 600; }
.dorm a { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 800; color: var(--ink2); text-decoration: none; }

/* ---------- Help ---------- */
.ask { margin: 16px 14px 0; padding: 18px; background: linear-gradient(160deg, #3B3196, #241E5C); color: #fff; border-radius: 26px; position: relative; overflow: hidden; }
.ask::after { content: "?"; position: absolute; right: 10px; top: -30px; font-family: var(--disp); font-size: 170px; font-weight: 800; opacity: .08; }
.ask h3 { font-size: 22px; }
.ask p { margin: 6px 0 12px; opacity: .85; font-size: 14px; line-height: 1.45; }
.ask textarea { width: 100%; min-height: 96px; border-radius: 16px; border: 0; padding: 14px; font: inherit; font-size: 16px; resize: vertical; outline: none; color: var(--ink); }
.ask .btn { margin-top: 10px; }
.qa { margin: 10px 14px 0; padding: 14px 16px; }
.qa .q { font-weight: 700; font-size: 15px; display: flex; gap: 8px; }
.qa .a { margin: 8px 0 0; font-size: 14px; color: var(--muted); line-height: 1.5; white-space: pre-wrap; padding-left: 26px; }
.faq { margin: 10px 14px 0; overflow: hidden; }
.faq summary { list-style: none; padding: 16px; font-weight: 700; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; margin-left: auto; width: 28px; height: 28px; border-radius: 50%; background: #F4EEE7; display: grid; place-items: center; font-size: 18px; transition: transform .2s; flex: none; }
.faq[open] summary::after { transform: rotate(45deg); background: var(--or); color: #fff; }
.faq p { margin: 0; padding: 0 16px 16px 50px; color: var(--muted); font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
.buddy { display: flex; gap: 12px; align-items: center; margin: 10px 14px 0; padding: 14px; }
.buddy .av { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(36,30,92,.25); background: linear-gradient(135deg, var(--or2), var(--or)) center/cover; display: grid; place-items: center; font-size: 26px; flex: none; color: #fff; font-weight: 800; }
.buddy b { display: block; font-size: 16px; }
.buddy span { font-size: 13px; color: var(--muted); display: block; }
.buddy p { margin: 4px 0 0; font-size: 13px; line-height: 1.4; }
.buddy a { margin-left: auto; flex: none; }
.foot { text-align: center; color: var(--muted); font-size: 13px; padding: 34px 20px 10px; line-height: 1.6; }
.foot a { color: var(--ink2); font-weight: 700; }

/* ---------- Tab bar ---------- */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 12px); z-index: 50; width: calc(100% - 24px); max-width: 520px; background: rgba(36,30,92,.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 26px; display: flex; padding: 7px; box-shadow: 0 16px 40px -10px rgba(36,30,92,.6); }
.tabbar button { flex: 1; height: 56px; border-radius: 20px; color: rgba(255,255,255,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 700; transition: all .25s; position: relative; }
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button.on { color: #fff; background: rgba(255,255,255,.12); }
.tabbar button.on svg { color: var(--or2); }
.tabbar .dot { position: absolute; top: 9px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--or); }

/* ---------- Sheet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 90; background: rgba(20,16,50,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 100; width: 100%; max-width: 560px; transform: translate(-50%, 105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); background: var(--cream); border-radius: 28px 28px 0 0; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--safe-b) + 24px); }
.sheet.show { transform: translate(-50%, 0); }
.grip { position: sticky; top: 0; z-index: 3; height: 22px; display: grid; place-items: center; }
.grip::before { content: ""; width: 42px; height: 5px; border-radius: 3px; background: rgba(36,30,92,.25); }

function fmtDate(it, long) {

    }

  const s = new Date(it.starts_at);

let carTimer = null;
function autoCarousel(el, dots, ms = 3500) {
  clearInterval(carTimer);
  if (!el) return;
  const cards = [...el.children];
  let i = 0, pausedUntil = 0;
  const target = c => c.offsetLeft - (el.clientWidth - c.offsetWidth) / 2;
  const nearest = () => cards.reduce((b, c, k) => Math.abs(target(c) - el.scrollLeft) < Math.abs(target(cards[b]) - el.scrollLeft) ? k : b, 0);
  const mark = k => dots && [...dots.children].forEach((d, j) => d.classList.toggle('on', j === k));
  el.addEventListener('scroll', () => { clearTimeout(el._st); el._st = setTimeout(() => { i = nearest(); mark(i); }, 80); }, { passive: true });
  const hold = () => { pausedUntil = Date.now() + 6000; };
  el.addEventListener('touchstart', hold, { passive: true });
  el.addEventListener('mousedown', hold);
  carTimer = setInterval(() => {
    if (!document.body.contains(el)) return clearInterval(carTimer);
    if (Date.now() < pausedUntil || document.hidden) return;
    i = (i + 1) % cards.length;
    el.scrollTo({ left: target(cards[i]), behavior: 'smooth' });
    mark(i);
  }, ms);
}

function confetti() {
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#F28C28', '#FFB25E', '#5247B8', '#ffffff', '#1F9D5B', '#7CA7FF'];
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (++f < 150) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height);
  })();
}

function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushOn() { return LS.get('erasmus.push', false) && window.Notification && Notification.permission === 'granted'; }
function b64u(s) { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); }
async function enablePush() {
  if (!pushSupported()) {
    return toast(/iPhone|iPad/.test(navigator.userAgent) ? 'Na iPhone: Safari → Zdieľať → Pridať na plochu, potom otvor appku z plochy a zapni upozornenia.' : 'Tento prehliadač upozornenia nepodporuje', 6500);
  }
  let perm; try { perm = await Notification.requestPermission(); } catch (_) { perm = Notification.permission; }
  if (perm !== 'granted') return toast('Upozornenia nie sú povolené – zapni ich v nastaveniach telefónu.', 5000);
  try {
    const reg = await navigator.serviceWorker.ready;
    let s = await reg.pushManager.getSubscription();
    if (!s) s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
    const j = s.toJSON();
    const { error } = await sb.from('erasmus_push').insert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
    if (error && error.code !== '23505') throw error;
    LS.set('erasmus.push', true); toast('🔔 Hotovo! Dáme ti vedieť o nových akciách.', 3500); render();
  } catch (e) { toast('Nepodarilo sa zapnúť upozornenia: ' + (e.message || e), 5000); }
}

async function admSave() {
  const b = $('#eSave'); b.disabled = true; b.textContent = 'Ukladám…';
  try {
    const v = id => { const el = $(id); return el ? el.value.trim() : undefined; };
    const row = { kind: editing.kind, title: v('#eT') || '', updated_at: new Date().toISOString(), published: $('#ePub').checked };
    if ($('#eS')) row.subtitle = v('#eS') || null;
    if ($('#eB')) row.body = v('#eB') || null;
    if ($('#eL')) row.link = v('#eL') || null;
    if ($('#eEm')) row.emoji = v('#eEm') || null;
    if ($('#eSo')) row.sort = parseInt(v('#eSo')) || 0;
    if ($('#eD')) {
      const d = v('#eD'), f = v('#eF'), to = v('#eTo');
      if (d) {
        const [y, m, dd] = d.split('-').map(Number);
        const mk = t => { const [h, mi] = t.split(':').map(Number); return new Date(y, m - 1, dd, h, mi); };
        const s = f ? mk(f) : new Date(y, m - 1, dd, 12, 0);
        let e = f && to ? mk(to) : null; if (e && e <= s) e.setDate(e.getDate() + 1);
        const de = v('#eDE');
        if (!f && de) { const [y2, m2, d2] = de.split('-').map(Number); e = new Date(y2, m2 - 1, d2, 12, 0); }
        row.starts_at = s.toISOString(); row.ends_at = e ? e.toISOString() : null; row.all_day = !f;
      } else { row.starts_at = null; row.ends_at = null; row.all_day = false; }
    }
    if (editing._file) {
      const blob = await shrink(editing._file);
      const path = `${editing.kind}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error } = await sb.storage.from('erasmus').upload(path, blob, { contentType: 'image/jpeg' });
      if (error) throw error;
      row.image_url = sb.storage.from('erasmus').getPublicUrl(path).data.publicUrl;
    } else if ('image_url' in editing) row.image_url = editing.image_url || null;
    if (editing.kind === 'photo' && !row.image_url) throw new Error('Vyber fotku');
    if (editing.kind !== 'photo' && !row.title) throw new Error('Doplň názov');
    const q = editing.id ? sb.from('erasmus_items').update(row).eq('id', editing.id) : sb.from('erasmus_items').insert(row);
    const { error } = await q; if (error) throw error;
    const n = $('#eN');
    if (n && n.checked && row.published) {
      const when = row.starts_at ? ' · ' + fmtDate(row) : '';
      const r = await sendPush((editing.kind === 'event' ? '🎉 ' : '📌 ') + row.title, (row.subtitle || '') + when);
      toast(r, 4000);
    } else toast('Uložené ✅');
    admPanel();
  } catch (e) { $('#eErr').textContent = e.message || String(e); b.disabled = false; b.textContent = 'Uložiť'; }
}

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
